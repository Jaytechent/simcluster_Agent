name: Simcluster Heartbeat Scheduler

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  trigger-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up and trigger all slots 
        run: |
          curl -X POST https://simcluster-agent.onrender.com/api/run-all \
          -H "Content-Type: application/json"